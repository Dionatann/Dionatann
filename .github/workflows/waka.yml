name: Update WakaTime metrics

on:
  schedule:
    # daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka:
    name: Write the table into the README
    runs-on: ubuntu-latest
    steps:
      # Without the secret the remaining steps are skipped instead of failing
      # every day.  To enable:
      #   gh secret set WAKATIME_API_KEY --repo Dionatann/Dionatann
      - name: Check whether the secret exists
        id: check
        env:
          WAKA_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -n "$WAKA_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WAKATIME_API_KEY is not configured; nothing to do."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.has_key == 'true'

      - name: Build the per-language hours table
        if: steps.check.outputs.has_key == 'true'
        uses: athul/waka-readme@v0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: "true"
          BLOCKS: "░▒▓█"
          TIME_RANGE: last_7_days
          LANG_COUNT: 8
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          COMMIT_MESSAGE: "chore: update WakaTime metrics"
